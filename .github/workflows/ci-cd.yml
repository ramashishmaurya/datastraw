name: DataStraw CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. Backend CI (Python / FastAPI)
  # ==========================================
  backend-ci:
    name: Backend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Integrity & Import
        run: |
          python -c "import main; print('Backend modules and FastAPI routes loaded successfully!')"

  # ==========================================
  # 2. Frontend CI (React / Vite / Tailwind)
  # ==========================================
  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Vite Production Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: "http://localhost:8000"

  # ==========================================
  # 3. Docker Container Build Verification
  # ==========================================
  docker-build:
    name: Docker Images Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: datastraw-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: datastraw-frontend:latest
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
